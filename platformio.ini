[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = InfernoEngine

[env:picow]
platform = https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
board = rpipico2w
